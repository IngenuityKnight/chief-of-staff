# CI gate (audit: enterprise-readiness / CI-CD). Typecheck, tests, build,
# and a dependency audit on every push and pull request.

name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # 24, not 20: the test script runs TypeScript directly via
          # --experimental-strip-types, which Node 20 rejects outright.
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build

      - name: Dependency audit (fail on high+)
        run: npm audit --omit=dev --audit-level=high
